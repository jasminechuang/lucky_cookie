<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運餅乾 | Lucky Cookie</title>
    <!-- 引入 Tailwind CSS 樣式框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-10deg); }
            40% { transform: rotate(10deg); }
            60% { transform: rotate(-10deg); }
            80% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 min-h-screen flex flex-col items-center justify-between p-6 text-gray-800">

    <!-- 頁首標題與分頁切換 -->
    <header class="text-center mt-4 w-full max-w-md">
        <h1 class="text-3xl font-bold text-amber-800 tracking-wider">🥠 每日幸運餅乾</h1>
        <p class="text-sm text-amber-600 mt-1">一天一籤，解鎖你的專屬運勢與日曆足跡</p>
        
        <!-- 分頁切換按鈕 -->
        <div class="flex justify-center gap-2 mt-4 bg-amber-200/50 p-1 rounded-xl">
            <button id="tab-cookie" onclick="switchTab('cookie')" class="flex-1 py-1.5 text-sm font-medium rounded-lg bg-white text-amber-800 shadow-sm transition-all">每日抽籤</button>
            <button id="tab-calendar" onclick="switchTab('calendar')" class="flex-1 py-1.5 text-sm font-medium rounded-lg text-amber-700 hover:text-amber-900 transition-all">運勢日曆</button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex flex-col items-center justify-center my-auto w-full max-w-md">
        
        <!-- 區塊一：抽餅乾主畫面 -->
        <div id="view-cookie" class="w-full flex flex-col items-center">
            <!-- 未開餅乾狀態 -->
            <div id="cookie-container" class="cursor-pointer text-center transition-transform hover:scale-105 active:scale-95 py-8" onclick="crackCookie()">
                <div id="cookie-icon" class="text-9xl select-none filter drop-shadow-lg">
                    🥠
                </div>
                <p class="mt-6 text-amber-700 font-medium bg-amber-200/60 px-4 py-2 rounded-full inline-block shadow-sm">
                    ✨ 點擊餅乾來剝開今日運勢
                </p>
            </div>

            <!-- 籤詩顯示區（預設隱藏） -->
            <div id="fortune-card" class="hidden bg-white/90 backdrop-blur-md rounded-2xl shadow-xl p-8 w-full border border-amber-200 text-center transform transition-all duration-500 scale-95 opacity-0">
                <div id="card-badge" class="text-xs uppercase tracking-widest text-amber-500 font-semibold mb-2">✦ 今日運勢已解鎖 ✦</div>
                <p id="fortune-text" class="text-lg font-medium text-gray-700 my-4 leading-relaxed"></p>
                
                <div class="flex justify-center gap-6 my-4 text-sm text-gray-600 bg-amber-50 py-3 rounded-xl border border-amber-100">
                    <div>
                        <span class="block text-xs text-amber-600 font-bold">幸運數字</span>
                        <span id="lucky-number" class="text-base font-bold text-gray-800">-</span>
                    </div>
                    <div class="border-l border-amber-200"></div>
                    <div>
                        <span class="block text-xs text-amber-600 font-bold">幸運顏色</span>
                        <span id="lucky-color" class="text-base font-bold text-gray-800">-</span>
                    </div>
                </div>

                <p id="daily-tip" class="text-xs text-gray-400 mt-4">明天再來抽取新的幸運餅乾喔！</p>
            </div>
        </div>

        <!-- 區塊二：日曆檢視畫面（預設隱藏） -->
        <div id="view-calendar" class="hidden w-full bg-white/90 backdrop-blur-md rounded-2xl shadow-xl p-6 border border-amber-200">
            <div class="flex justify-between items-center mb-4">
                <button onclick="changeMonth(-1)" class="p-1 rounded-lg hover:bg-amber-100 text-amber-700 font-bold">&lt;</button>
                <h2 id="calendar-month-title" class="text-base font-bold text-amber-800">2026年9月</h2>
                <button onclick="changeMonth(1)" class="p-1 rounded-lg hover:bg-amber-100 text-amber-700 font-bold">&gt;</button>
            </div>

            <!-- 星期標題 -->
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-amber-600 mb-2">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>

            <!-- 日期格子 -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-sm">
                <!-- 動態生成 -->
            </div>

            <!-- 選中日期的籤詩預覽 -->
            <div id="calendar-preview" class="mt-4 pt-4 border-t border-amber-100 text-xs text-gray-600 min-h-[50px] flex items-center justify-center text-center italic text-gray-400">
                點擊有標記的日期查看當日籤詩
            </div>
        </div>

    </main>

    <!-- 底部資訊 -->
    <footer class="w-full max-w-md mb-2 text-center">
        <p class="text-xs text-amber-600/60">Lucky Cookie App © 2026</p>
        <button onclick="clearHistory()" class="text-[11px] text-gray-400 hover:text-red-500 transition-colors mt-1 underline">清除所有紀錄與重置</button>
    </footer>

    <!-- JavaScript 互動邏輯 -->
    <script>
        const fortunes = [
            { text: "今天會遇到意料之外的小確幸，保持微笑，好運自然來！", numbers: [3, 17, 28], color: "暖黃色" },
            { text: "放慢腳步，最好的安排正在路上，不要太急著否定自己。", numbers: [7, 12, 33], color: "天空藍" },
            { text: "大膽去嘗試一直想做卻猶豫的事，今天宇宙會默默支持你。", numbers: [1, 9, 44], color: "草綠色" },
            { text: "給自己一杯好喝的飲料，今天的靈感與效率會異常高漲！", numbers: [5, 18, 22], color: "薰衣草紫" },
            { text: "生活中微小的溫暖正圍繞著你，試著對身邊的人事物表達感謝。", numbers: [8, 16, 50], color: "柔粉紅" },
            { text: "遇到瓶頸時不妨轉個彎，柳暗花明又一村就在下個轉角。", numbers: [2, 11, 29], color: "象牙白" },
            { text: "今天非常適合好好休息、沉澱心靈，養精蓄銳是為了走更長遠的路。", numbers: [4, 19, 36], color: "米灰色" },
            { text: "貴人就在你身邊，主動開口打招呼會帶來意想不到的好收穫。", numbers: [6, 15, 25], color: "珊瑚橘" }
        ];

        // 歷史紀錄儲存格式改為物件：{ "YYYY-MM-DD": { text, numbers, color, time } }
        let historyData = JSON.parse(localStorage.getItem('lucky_cookie_history_map')) || {};
        
        const todayStr = new Date().toISOString().split('T')[0];
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0-11

        window.addEventListener('DOMContentLoaded', () => {
            if (historyData[todayStr]) {
                showFortuneCard(historyData[todayStr], true);
            }
            renderCalendar();
        });

        // 頁籤切換
        function switchTab(tab) {
            const tabCookie = document.getElementById('tab-cookie');
            const tabCalendar = document.getElementById('tab-calendar');
            const viewCookie = document.getElementById('view-cookie');
            const viewCalendar = document.getElementById('view-calendar');

            if (tab === 'cookie') {
                tabCookie.className = "flex-1 py-1.5 text-sm font-medium rounded-lg bg-white text-amber-800 shadow-sm transition-all";
                tabCalendar.className = "flex-1 py-1.5 text-sm font-medium rounded-lg text-amber-700 hover:text-amber-900 transition-all";
                viewCookie.classList.remove('hidden');
                viewCalendar.classList.add('hidden');
            } else {
                tabCalendar.className = "flex-1 py-1.5 text-sm font-medium rounded-lg bg-white text-amber-800 shadow-sm transition-all";
                tabCookie.className = "flex-1 py-1.5 text-sm font-medium rounded-lg text-amber-700 hover:text-amber-900 transition-all";
                viewCalendar.classList.remove('hidden');
                viewCookie.classList.add('hidden');
                renderCalendar();
            }
        }

        function crackCookie() {
            const cookieIcon = document.getElementById('cookie-icon');
            cookieIcon.classList.add('animate-shake');

            setTimeout(() => {
                const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const record = {
                    text: randomFortune.text,
                    numbers: randomFortune.numbers,
                    color: randomFortune.color,
                    time: timeStr
                };

                historyData[todayStr] = record;
                localStorage.setItem('lucky_cookie_history_map', JSON.stringify(historyData));

                showFortuneCard(record, false);
                cookieIcon.classList.remove('animate-shake');
            }, 500);
        }

        function showFortuneCard(fortune, isAlreadyDrawn) {
            const cookieContainer = document.getElementById('cookie-container');
            const fortuneCard = document.getElementById('fortune-card');
            const fortuneText = document.getElementById('fortune-text');
            const luckyNumber = document.getElementById('lucky-number');
            const luckyColor = document.getElementById('lucky-color');
            const cardBadge = document.getElementById('card-badge');

            fortuneText.textContent = fortune.text;
            luckyNumber.textContent = fortune.numbers.join(', ');
            luckyColor.textContent = fortune.color;

            if (isAlreadyDrawn) {
                cardBadge.textContent = "✦ 今日已領取過幸運餅乾 ✦";
            } else {
                cardBadge.textContent = "✦ 今日籤詩已解鎖 ✦";
            }

            cookieContainer.classList.add('hidden');
            fortuneCard.classList.remove('hidden');
            
            setTimeout(() => {
                fortuneCard.classList.remove('scale-95', 'opacity-0');
                fortuneCard.classList.add('scale-100', 'opacity-100');
            }, 50);
        }

        // 渲染日曆
        function renderCalendar() {
            const title = document.getElementById('calendar-month-title');
            const grid = document.getElementById('calendar-grid');
            
            title.textContent = `${currentYear}年${currentMonth + 1}月`;
            grid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            // 填入空白格（對齊星期）
            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div></div>`;
            }

            // 填入當月日期
            for (let day = 1; day <= totalDays; day++) {
                const monthStr = String(currentMonth + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

                const hasRecord = historyData[dateKey];
                const isToday = dateKey === todayStr;

                let cellClass = "h-9 w-9 mx-auto flex flex-col items-center justify-center rounded-full text-xs transition-all ";
                
                if (hasRecord) {
                    cellClass += "bg-amber-200 text-amber-900 font-bold cursor-pointer hover:bg-amber-300 shadow-sm";
                } else {
                    cellClass += "text-gray-500";
                }

                if (isToday) {
                    cellClass += " ring-2 ring-amber-600";
                }

                grid.innerHTML += `
                    <div class="${cellClass}" ${hasRecord ? `onclick="previewDay('${dateKey}')"` : ''}>
                        <span>${day}</span>
                        ${hasRecord ? '<span class="text-[9px] leading-none">🥠</span>' : ''}
                    </div>
                `;
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function previewDay(dateKey) {
            const record = historyData[dateKey];
            const previewBox = document.getElementById('calendar-preview');
            if (record) {
                previewBox.className = "mt-4 pt-4 border-t border-amber-100 text-xs text-gray-700 text-left bg-amber-50/60 p-3 rounded-xl";
                previewBox.innerHTML = `
                    <div class="font-bold text-amber-800 mb-1">📅 ${dateKey} 籤詩：</div>
                    <div class="mb-1">${record.text}</div>
                    <div class="text-[10px] text-amber-600">幸運數字：${record.numbers.join(', ')} | 幸運顏色：${record.color}</div>
                `;
            }
        }

        function clearHistory() {
            if (confirm("確定要清除所有抽籤紀錄與日曆足跡嗎？")) {
                localStorage.removeItem('lucky_cookie_history_map');
                historyData = {};
                location.reload();
            }
        }
    </script>
</body>
</html>
