<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星象命盤幸運餅乾 | Lucky Cookie</title>
    <!-- 引入 Tailwind CSS 樣式框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-10deg); }
            40% { transform: rotate(10deg); }
            60% { transform: rotate(-10deg); }
            80% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-900 to-amber-950 min-h-screen flex flex-col items-center justify-between p-6 text-gray-100">

    <!-- 頁首標題與分頁切換 -->
    <header class="text-center mt-4 w-full max-w-md">
        <h1 class="text-3xl font-bold text-amber-300 tracking-wider">🌟 命盤星象幸運餅乾</h1>
        <p class="text-xs text-purple-200 mt-1">融合星座命盤與東方流年運勢的專屬解籤</p>
        
        <!-- 使用者命盤資訊狀態列 -->
        <div id="user-profile-bar" onclick="openProfileModal()" class="mt-3 bg-purple-900/60 border border-purple-500/30 rounded-xl px-4 py-2 text-xs flex justify-between items-center cursor-pointer hover:bg-purple-800/60 transition-all shadow-md">
            <span id="profile-status-text" class="text-amber-200">✨ 點此設定你的生日與星座命盤</span>
            <span class="text-purple-300 underline text-[11px]">修改設定</span>
        </div>

        <!-- 分頁切換按鈕 -->
        <div class="flex justify-center gap-2 mt-3 bg-purple-950/60 p-1 rounded-xl border border-purple-800/50">
            <button id="tab-cookie" onclick="switchTab('cookie')" class="flex-1 py-1.5 text-sm font-medium rounded-lg bg-amber-500 text-gray-950 shadow-sm transition-all font-bold">每日抽籤</button>
            <button id="tab-calendar" onclick="switchTab('calendar')" class="flex-1 py-1.5 text-sm font-medium rounded-lg text-purple-200 hover:text-white transition-all">命盤日曆</button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex flex-col items-center justify-center my-auto w-full max-w-md">
        
        <!-- 區塊一：抽餅乾主畫面 -->
        <div id="view-cookie" class="w-full flex flex-col items-center">
            <!-- 未開餅乾狀態 -->
            <div id="cookie-container" class="cursor-pointer text-center transition-transform hover:scale-105 active:scale-95 py-8" onclick="crackCookie()">
                <div id="cookie-icon" class="text-9xl select-none filter drop-shadow-[0_10px_15px_rgba(251,191,36,0.3)]">
                    🥠
                </div>
                <p class="mt-6 text-amber-200 font-medium bg-amber-500/20 border border-amber-500/30 px-5 py-2.5 rounded-full inline-block shadow-sm">
                    ✨ 點擊餅乾，感應今日星象流年
                </p>
            </div>

            <!-- 籤詩顯示區（預設隱藏） -->
            <div id="fortune-card" class="hidden bg-purple-950/80 backdrop-blur-md rounded-2xl shadow-2xl p-6 w-full border border-amber-500/40 text-center transform transition-all duration-500 scale-95 opacity-0">
                <div id="card-badge" class="text-xs uppercase tracking-widest text-amber-400 font-semibold mb-1">✦ 本命星象解籤完畢 ✦</div>
                <div id="card-zodiac-tag" class="inline-block bg-amber-500/20 text-amber-300 text-[11px] px-3 py-0.5 rounded-full mb-3 border border-amber-500/30"></div>
                
                <p id="fortune-text" class="text-base font-medium text-gray-100 my-2 leading-relaxed"></p>
                
                <!-- 命盤靈性解析 -->
                <div id="astrology-insight" class="bg-purple-900/50 border border-purple-700/50 rounded-xl p-3 my-3 text-left text-xs text-purple-200 space-y-1">
                    <!-- 動態帶入守護星與宮位指引 -->
                </div>

                <div class="flex justify-center gap-4 my-3 text-sm text-gray-300 bg-purple-900/80 py-2.5 rounded-xl border border-purple-700/40">
                    <div>
                        <span class="block text-[10px] text-amber-400 font-bold">幸運星數</span>
                        <span id="lucky-number" class="text-sm font-bold text-white">-</span>
                    </div>
                    <div class="border-l border-purple-700"></div>
                    <div>
                        <span class="block text-[10px] text-amber-400 font-bold">靈性色彩</span>
                        <span id="lucky-color" class="text-sm font-bold text-white">-</span>
                    </div>
                    <div class="border-l border-purple-700"></div>
                    <div>
                        <span class="block text-[10px] text-amber-400 font-bold">流年方位</span>
                        <span id="lucky-dir" class="text-sm font-bold text-white">-</span>
                    </div>
                </div>

                <p id="daily-tip" class="text-[11px] text-purple-300/80 mt-2">✨ 結合你的命盤星象，本日運勢已為你流轉鎖定</p>
            </div>
        </div>

        <!-- 區塊二：日曆檢視畫面（預設隱藏） -->
        <div id="view-calendar" class="hidden w-full bg-purple-950/80 backdrop-blur-md rounded-2xl shadow-2xl p-6 border border-amber-500/40">
            <div class="flex justify-between items-center mb-4">
                <button onclick="changeMonth(-1)" class="p-1.5 rounded-lg hover:bg-purple-900 text-amber-300 font-bold">&lt;</button>
                <h2 id="calendar-month-title" class="text-base font-bold text-amber-300">2026年9月</h2>
                <button onclick="changeMonth(1)" class="p-1.5 rounded-lg hover:bg-purple-900 text-amber-300 font-bold">&gt;</button>
            </div>

            <!-- 星期標題 -->
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-purple-300 mb-2">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>

            <!-- 日期格子 -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-sm">
                <!-- 動態生成 -->
            </div>

            <!-- 選中日期的籤詩預覽 -->
            <div id="calendar-preview" class="mt-4 pt-4 border-t border-purple-800/60 text-xs text-gray-300 min-h-[60px] flex items-center justify-center text-center italic text-purple-400">
                點擊有標記的日期查看當日星象籤詩
            </div>
        </div>

    </main>

    <!-- 生日與星座設定彈窗 (Modal) -->
    <div id="profile-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-purple-950 border border-amber-500/40 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-gray-100">
            <h3 class="text-lg font-bold text-amber-300 mb-2">🔮 設定你的命盤星象</h3>
            <p class="text-xs text-purple-200 mb-4">輸入生日將自動對應星座、守護星與東方紫微命宮流年，讓餅乾更貼近你的運勢軌跡。</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-amber-300 mb-1">你的生日</label>
                    <input type="date" id="input-birthday" class="w-full bg-purple-900/60 border border-purple-700/60 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-300 mb-1">或直接選擇星座</label>
                    <select id="input-zodiac" class="w-full bg-purple-900/60 border border-purple-700/60 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                        <option value="">-- 自動由生日計算 --</option>
                        <option value="牡羊座">牡羊座 (Aries)</option>
                        <option value="金牛座">金牛座 (Taurus)</option>
                        <option value="雙子座">雙子座 (Gemini)</option>
                        <option value="巨蟹座">巨蟹座 (Cancer)</option>
                        <option value="獅子座">獅子座 (Leo)</option>
                        <option value="處女座">處女座 (Virgo)</option>
                        <option value="天秤座">天秤座 (Libra)</option>
                        <option value="天蠍座">天蠍座 (Scorpio)</option>
                        <option value="射手座">射手座 (Sagittarius)</option>
                        <option value="魔羯座">魔羯座 (Capricorn)</option>
                        <option value="水瓶座">水瓶座 (Aquarius)</option>
                        <option value="雙魚座">雙魚座 (Pisces)</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="closeProfileModal()" class="flex-1 bg-purple-900 hover:bg-purple-800 text-purple-200 py-2 rounded-xl text-xs font-medium transition-colors">取消</button>
                <button onclick="saveProfile()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-gray-950 py-2 rounded-xl text-xs font-bold transition-colors">儲存命盤</button>
            </div>
        </div>
    </div>

    <!-- 底部資訊 -->
    <footer class="w-full max-w-md mb-2 text-center">
        <p class="text-xs text-purple-400/60">Astrology Lucky Cookie © 2026</p>
        <button onclick="clearHistory()" class="text-[11px] text-purple-400/70 hover:text-red-400 transition-colors mt-1 underline">清除所有紀錄與重置</button>
    </footer>

    <!-- JavaScript 互動與星象邏輯 -->
    <script>
        // 星座與星象資料庫（結合西方元素與類似紫微命宮流年的智慧解讀）
        const fortunePool = [
            { text: "命宮紫微星曜閃耀，今日在事業與學業上將有突破性的靈感降臨。", ziwei: "紫微命宮：主領導力與貴人提拔，勇敢展現自我。" },
            { text: "財帛宮位氣場流轉，正財運穩健，適合審視財務配置或規劃長遠投資。", ziwei: "武曲財星：主財源廣進，精準決策帶來實質收穫。" },
            { text: "福德宮星象溫潤，人際關係和諧，與朋友的交流將為你解開心中疑惑。", ziwei: "天同福星：主心境平和，得朋輩之助，樂觀迎來轉機。" },
            { text: "官祿宮能量充沛，面對挑戰時能展現超乎常人的韌性與卓越執行力。", ziwei: "天機智星：主應變靈活，抽絲剝繭後難題迎刃而解。" },
            { text: "遷移宮吉星高照，今日非常適合外出走動、吸收新知或嘗試全新領域。", ziwei: "太陽巨門：主遠行開闊視野，跨界交流碰撞出絕佳火花。" },
            { text: "夫妻宮與人際宮位連結緊密，真誠的傾聽與溫暖互動將為你贏得信任。", ziwei: "天梁蔭星：主長輩緣與貴人庇佑，以誠待人福報自來。" }
        ];

        // 守護星與元素對照
        const zodiacMeta = {
            "牡羊座": { element: "火象", star: "火星", palace: "命宮・開創" },
            "金牛座": { element: "土象", star: "金星", palace: "財帛・積蓄" },
            "雙子座": { element: "風象", star: "水星", palace: "兄弟・溝通" },
            "巨蟹座": { element: "水象", star: "月亮", palace: "田宅・內心" },
            "獅子座": { element: "火象", star: "太陽", palace: "男女・光芒" },
            "處女座": { element: "土象", star: "水星", palace: "奴僕・細緻" },
            "天秤座": { element: "風象", star: "金星", palace: "夫妻・和諧" },
            "天蠍座": { element: "水象", star: "冥王星", palace: "疾厄・轉化" },
            "射手座": { element: "火象", star: "木星", palace: "遷移・探索" },
            "魔羯座": { element: "土象", star: "土星", palace: "官祿・成就" },
            "水瓶座": { element: "風象", star: "天王星", palace: "福德・創新" },
            "雙魚座": { element: "水象", star: "海王星", palace: "父母・直覺" }
        };

        // 狀態管理
        let userProfile = JSON.parse(localStorage.getItem('lucky_cookie_profile')) || null;
        let historyData = JSON.parse(localStorage.getItem('lucky_cookie_astrology_map')) || {};
        
        const todayStr = new Date().toISOString().split('T')[0];
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();

        window.addEventListener('DOMContentLoaded', () => {
            updateProfileUI();
            if (historyData[todayStr]) {
                showFortuneCard(historyData[todayStr], true);
            }
            renderCalendar();
        });

        // 命盤設定互動
        function openProfileModal() {
            document.getElementById('profile-modal').classList.remove('hidden');
            if (userProfile) {
                if (userProfile.birthday) document.getElementById('input-birthday').value = userProfile.birthday;
                if (userProfile.zodiac) document.getElementById('input-zodiac').value = userProfile.zodiac;
            }
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        function saveProfile() {
            const bday = document.getElementById('input-birthday').value;
            let zodiac = document.getElementById('input-zodiac').value;

            if (!zodiac && bday) {
                zodiac = calculateZodiac(bday);
            }

            if (!zodiac) {
                zodiac = "牡羊座"; // 預設
            }

            userProfile = {
                birthday: bday,
                zodiac: zodiac,
                meta: zodiacMeta[zodiac] || { element: "風象", star: "木星", palace: "命宮" }
            };

            localStorage.setItem('lucky_cookie_profile', JSON.stringify(userProfile));
            updateProfileUI();
            closeProfileModal();
        }

        function calculateZodiac(bdayStr) {
            const date = new Date(bdayStr);
            const m = date.getMonth() + 1;
            const d = date.getDate();

            if ((m === 3 && d >= 21) || (m === 4 && d <= 19)) return "牡羊座";
            if ((m === 4 && d >= 20) || (m === 5 && d <= 20)) return "金牛座";
            if ((m === 5 && d >= 21) || (m === 6 && d <= 21)) return "雙子座";
            if ((m === 6 && d >= 22) || (m === 7 && d <= 22)) return "巨蟹座";
            if ((m === 7 && d >= 23) || (m === 8 && d <= 22)) return "獅子座";
            if ((m === 8 && d >= 23) || (m === 9 && d <= 22)) return "處女座";
            if ((m === 9 && d >= 23) || (m === 10 && d <= 23)) return "天秤座";
            if ((m === 10 && d >= 24) || (m === 11 && d <= 21)) return "天蠍座";
            if ((m === 11 && d >= 22) || (m === 12 && d <= 21)) return "射手座";
            if ((m === 12 && d >= 22) || (m === 1 && d <= 19)) return "魔羯座";
            if ((m === 1 && d >= 20) || (m === 2 && d <= 18)) return "水瓶座";
            return "雙魚座";
        }

        function updateProfileUI() {
            const statusText = document.getElementById('profile-status-text');
            if (userProfile && userProfile.zodiac) {
                const meta = userProfile.meta;
                statusText.innerHTML = `🔮 你的命盤：<strong class="text-amber-300">${userProfile.zodiac}</strong>（${meta.element}・守護星：${meta.star}）`;
            } else {
                statusText.innerHTML = `✨ 點此設定你的生日與星座命盤（解鎖專屬星象運勢）`;
            }
        }

        // 頁籤切換
        function switchTab(tab) {
            const tabCookie = document.getElementById('tab-cookie');
            const tabCalendar = document.getElementById('tab-calendar');
            const viewCookie = document.getElementById('view-cookie');
            const viewCalendar = document.getElementById('view-calendar');

            if (tab === 'cookie') {
                tabCookie.className = "flex-1 py-1.5 text-sm font-medium rounded-lg bg-amber-500 text-gray-950 shadow-sm transition-all font-bold";
                tabCalendar.className = "flex-1 py-1.5 text-sm font-medium rounded-lg text-purple-200 hover:text-white transition-all";
                viewCookie.classList.remove('hidden');
                viewCalendar.classList.add('hidden');
            } else {
                tabCalendar.className = "flex-1 py-1.5 text-sm font-medium rounded-lg bg-amber-500 text-gray-950 shadow-sm transition-all font-bold";
                tabCookie.className = "flex-1 py-1.5 text-sm font-medium rounded-lg text-purple-200 hover:text-white transition-all";
                viewCalendar.classList.remove('hidden');
                viewCookie.classList.add('hidden');
                renderCalendar();
            }
        }

        function crackCookie() {
            if (!userProfile) {
                openProfileModal();
                return;
            }

            const cookieIcon = document.getElementById('cookie-icon');
            cookieIcon.classList.add('animate-shake');

            setTimeout(() => {
                const randomFortune = fortunePool[Math.floor(Math.random() * fortunePool.length)];
                const numbers = [
                    Math.floor(Math.random() * 40) + 1,
                    Math.floor(Math.random() * 40) + 1,
                    Math.floor(Math.random() * 40) + 1
                ];
                const colors = ["星辰紫", "琥珀金", "琉璃藍", "月光銀", "翡翠綠", "曙光橙"];
                const directions = ["東南方", "正北方", "西北方", "正南方", "東北方", "正西方"];
                
                const record = {
                    zodiac: userProfile.zodiac,
                    meta: userProfile.meta,
                    text: randomFortune.text,
                    ziwei: randomFortune.ziwei,
                    numbers: numbers,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    dir: directions[Math.floor(Math.random() * directions.length)],
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                historyData[todayStr] = record;
                localStorage.setItem('lucky_cookie_astrology_map', JSON.stringify(historyData));

                showFortuneCard(record, false);
                cookieIcon.classList.remove('animate-shake');
            }, 500);
        }

        function showFortuneCard(fortune, isAlreadyDrawn) {
            const cookieContainer = document.getElementById('cookie-container');
            const fortuneCard = document.getElementById('fortune-card');
            const fortuneText = document.getElementById('fortune-text');
            const luckyNumber = document.getElementById('lucky-number');
            const luckyColor = document.getElementById('lucky-color');
            const luckyDir = document.getElementById('lucky-dir');
            const cardBadge = document.getElementById('card-badge');
            const zodiacTag = document.getElementById('card-zodiac-tag');
            const astrologyInsight = document.getElementById('astrology-insight');

            fortuneText.textContent = fortune.text;
            luckyNumber.textContent = fortune.numbers.join(', ');
            luckyColor.textContent = fortune.color;
            luckyDir.textContent = fortune.dir;
            zodiacTag.textContent = `✦ ${fortune.zodiac}・${fortune.meta.element}能量 ✦`;

            astrologyInsight.innerHTML = `
                <div class="font-semibold text-amber-300">🪐 星象守護與紫微宮位：</div>
                <div>• 本命宮位：${fortune.meta.palace}</div>
                <div>• 流年星曜：${fortune.ziwei}</div>
            `;

            if (isAlreadyDrawn) {
                cardBadge.textContent = "✦ 今日命盤運勢已解鎖 ✦";
            } else {
                cardBadge.textContent = "✦ 星象動能感應完成 ✦";
            }

            cookieContainer.classList.add('hidden');
            fortuneCard.classList.remove('hidden');
            
            setTimeout(() => {
                fortuneCard.classList.remove('scale-95', 'opacity-0');
                fortuneCard.classList.add('scale-100', 'opacity-100');
            }, 50);
        }

        // 渲染日曆
        function renderCalendar() {
            const title = document.getElementById('calendar-month-title');
            const grid = document.getElementById('calendar-grid');
            
            title.textContent = `${currentYear}年${currentMonth + 1}月`;
            grid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const monthStr = String(currentMonth + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

                const hasRecord = historyData[dateKey];
                const isToday = dateKey === todayStr;

                let cellClass = "h-9 w-9 mx-auto flex flex-col items-center justify-center rounded-full text-xs transition-all ";
                
                if (hasRecord) {
                    cellClass += "bg-amber-500 text-gray-950 font-bold cursor-pointer hover:bg-amber-400 shadow-md";
                } else {
                    cellClass += "text-purple-300/70";
                }

                if (isToday) {
                    cellClass += " ring-2 ring-amber-300";
                }

                grid.innerHTML += `
                    <div class="${cellClass}" ${hasRecord ? `onclick="previewDay('${dateKey}')"` : ''}>
                        <span>${day}</span>
                        ${hasRecord ? '<span class="text-[9px] leading-none font-bold">🥠</span>' : ''}
                    </div>
                `;
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function previewDay(dateKey) {
            const record = historyData[dateKey];
            const previewBox = document.getElementById('calendar-preview');
            if (record) {
                previewBox.className = "mt-4 pt-4 border-t border-purple-800/60 text-xs text-gray-200 text-left bg-purple-900/60 p-3 rounded-xl border border-purple-700/50";
                previewBox.innerHTML = `
                    <div class="font-bold text-amber-300 mb-1">📅 ${dateKey}（${record.zodiac}）星象籤詩：</div>
                    <div class="mb-1">${record.text}</div>
                    <div class="text-[10px] text-purple-200 mt-1">${record.ziwei}</div>
                `;
            }
        }

        function clearHistory() {
            if (confirm("確定要清除所有命盤紀錄與日曆足跡嗎？")) {
                localStorage.removeItem('lucky_cookie_astrology_map');
                localStorage.removeItem('lucky_cookie_profile');
                historyData = {};
                userProfile = null;
