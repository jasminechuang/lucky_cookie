<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運餅乾 | Lucky Cookie</title>
    <!-- 引入 Tailwind CSS 樣式框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-10deg); }
            40% { transform: rotate(10deg); }
            60% { transform: rotate(-10deg); }
            80% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 min-h-screen flex flex-col items-center justify-between p-6 text-gray-800">

    <!-- 頁首標題 -->
    <header class="text-center mt-6">
        <h1 class="text-3xl font-bold text-amber-800 tracking-wider">🥠 每日幸運餅乾</h1>
        <p class="text-sm text-amber-600 mt-1">點擊餅乾，揭曉你今天的專屬小語與運勢！</p>
    </header>

    <!-- 主要互動區 -->
    <main class="flex flex-col items-center justify-center my-auto w-full max-w-md">
        
        <!-- 未開餅乾狀態 -->
        <div id="cookie-container" class="cursor-pointer text-center transition-transform hover:scale-105 active:scale-95 py-8" onclick="crackCookie()">
            <div id="cookie-icon" class="text-9xl select-none filter drop-shadow-lg">
                🥠
            </div>
            <p class="mt-6 text-amber-700 font-medium bg-amber-200/60 px-4 py-2 rounded-full inline-block shadow-sm">
                ✨ 點擊餅乾來剝開它
            </p>
        </div>

        <!-- 籤詩顯示區（預設隱藏） -->
        <div id="fortune-card" class="hidden bg-white/90 backdrop-blur-md rounded-2xl shadow-xl p-8 w-full border border-amber-200 text-center transform transition-all duration-500 scale-95 opacity-0">
            <div class="text-xs uppercase tracking-widest text-amber-500 font-semibold mb-2">✦ 今日籤詩 ✦</div>
            <p id="fortune-text" class="text-lg font-medium text-gray-700 my-4 leading-relaxed"></p>
            
            <div class="flex justify-center gap-6 my-4 text-sm text-gray-600 bg-amber-50 py-3 rounded-xl border border-amber-100">
                <div>
                    <span class="block text-xs text-amber-600 font-bold">幸運數字</span>
                    <span id="lucky-number" class="text-base font-bold text-gray-800">-</span>
                </div>
                <div class="border-l border-amber-200"></div>
                <div>
                    <span class="block text-xs text-amber-600 font-bold">幸運顏色</span>
                    <span id="lucky-color" class="text-base font-bold text-gray-800">-</span>
                </div>
            </div>

            <button onclick="resetCookie()" class="mt-6 w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 px-6 rounded-xl shadow transition-colors">
                再抽一次餅乾 🥠
            </button>
        </div>

    </main>

    <!-- 歷史紀錄區 -->
    <footer class="w-full max-w-md mb-4">
        <div class="bg-white/60 backdrop-blur rounded-xl p-4 shadow-sm border border-amber-100">
            <h2 class="text-xs font-bold text-amber-700 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>📜 歷史籤詩紀錄</span>
                <button onclick="clearHistory()" class="text-xs text-gray-400 hover:text-red-500 transition-colors">清除紀錄</button>
            </h2>
            <ul id="history-list" class="text-xs text-gray-600 space-y-1.5 max-h-28 overflow-y-auto pr-1">
                <li class="text-gray-400 italic">尚未有抽籤紀錄...</li>
            </ul>
        </div>
        <p class="text-center text-xs text-amber-600/60 mt-4">Lucky Cookie Prototype © 2026</p>
    </footer>

    <!-- JavaScript 互動邏輯 -->
    <script>
        // 籤詩資料庫
        const fortunes = [
            { text: "今天會遇到意料之外的小確幸，保持微笑，好運自然來！", numbers: [3, 17, 28], color: "暖黃色" },
            { text: "放慢腳步，最好的安排正在路上，不要太急著否定自己。", numbers: [7, 12, 33], color: "天空藍" },
            { text: "大膽去嘗試一直想做卻猶豫的事，今天宇宙會默默支持你。", numbers: [1, 9, 44], color: "草綠色" },
            { text: "給自己一杯好喝的飲料，今天的靈感與效率會異常高漲！", numbers: [5, 18, 22], color: "薰衣草紫" },
            { text: "生活中微小的溫暖正圍繞著你，試著對身邊的人事物表達感謝。", numbers: [8, 16, 50], color: "柔粉紅" },
            { text: "遇到瓶頸時不妨轉個彎，柳暗花明又一村就在下個轉角。", numbers: [2, 11, 29], color: "象牙白" },
            { text: "今天非常適合好好休息、沉澱心靈，養精蓄銳是為了走更長遠的路。", numbers: [4, 19, 36], color: "米灰色" },
            { text: "貴人就在你身邊，主動開口打招呼會帶來意想不到的好收穫。", numbers: [6, 15, 25], color: "珊瑚橘" }
        ];

        let history = JSON.parse(localStorage.getItem('lucky_cookie_history')) || [];
        renderHistory();

        function crackCookie() {
            const cookieContainer = document.getElementById('cookie-container');
            const cookieIcon = document.getElementById('cookie-icon');
            const fortuneCard = document.getElementById('fortune-card');
            const fortuneText = document.getElementById('fortune-text');
            const luckyNumber = document.getElementById('lucky-number');
            const luckyColor = document.getElementById('lucky-color');

            // 播放晃動特效
            cookieIcon.classList.add('animate-shake');

            setTimeout(() => {
                // 隨機抽選一則籤詩
                const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
                
                // 填入資料
                fortuneText.textContent = randomFortune.text;
                luckyNumber.textContent = randomFortune.numbers.join(', ');
                luckyColor.textContent = randomFortune.color;

                // 隱藏餅乾，顯示籤詩卡片
                cookieContainer.classList.add('hidden');
                fortuneCard.classList.remove('hidden');
                
                // 讓卡片淡入放大
                setTimeout(() => {
                    fortuneCard.classList.remove('scale-95', 'opacity-0');
                    fortuneCard.classList.add('scale-100', 'opacity-100');
                }, 50);

                // 儲存到歷史紀錄
                saveToHistory(randomFortune.text);

                // 移除晃動動畫類別供下次使用
                cookieIcon.classList.remove('animate-shake');
            }, 500);
        }

        function resetCookie() {
            const cookieContainer = document.getElementById('cookie-container');
            const fortuneCard = document.getElementById('fortune-card');

            // 隱藏籤詩卡片，顯示餅乾
            fortuneCard.classList.remove('scale-100', 'opacity-100');
            fortuneCard.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                fortuneCard.classList.add('hidden');
                cookieContainer.classList.remove('hidden');
            }, 300);
        }

        function saveToHistory(text) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            history.unshift({ time: timeStr, text: text });
            if (history.length > 5) history.pop(); // 最多保留 5 筆
            localStorage.setItem('lucky_cookie_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            if (history.length === 0) {
                historyList.innerHTML = `<li class="text-gray-400 italic">尚未有抽籤紀錄...</li>`;
                return;
            }

            historyList.innerHTML = history.map(item => `
                <li class="truncate bg-amber-50/50 px-2 py-1 rounded flex justify-between items-center">
                    <span class="truncate mr-2">🥠 ${item.text}</span>
                    <span class="text-gray-400 text-[10px] shrink-0">${item.time}</span>
                </li>
            `).join('');
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('lucky_cookie_history');
            renderHistory();
        }
    </script>
</body>
</html>
